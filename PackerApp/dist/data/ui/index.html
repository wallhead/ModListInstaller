<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nordic Modlist Installer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="installer-shell">
      <section class="content">
        <header class="header">
          <div>
            <p class="eyebrow" id="stepLabel">Local package installer</p>
            <h1>Nordic Modlist Installer</h1>
          </div>
          <div class="version" id="versionText">Local package mode</div>
        </header>

        <section class="panel">
          <div class="welcome" id="welcomePanel">
            <p>
              Установщик проверяет, распаковывает и устанавливает файлы сборки в указанную папку.
            </p>
          </div>

          <div class="form-grid">
            <label for="unpackDrive">Диск для распаковки</label>
            <div class="field-row compact">
              <select id="unpackDrive"></select>
              <span class="target" id="unpackTarget">Выберите диск</span>
            </div>

            <label for="installFolder">Папка установки</label>
            <div class="field-row">
              <input id="installFolder" type="text" autocomplete="off" spellcheck="false" />
              <button type="button" id="browseInstall">Обзор</button>
            </div>
          </div>

          <div class="progress-wrap">
            <div class="progress-line">
              <span id="statusText">Ожидание | Ожидание проверки</span>
              <strong id="percentText">0%</strong>
            </div>
            <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <span id="progressFill"></span>
            </div>
          </div>

          <textarea id="logOutput" readonly spellcheck="false"></textarea>
        </section>

        <footer class="footer">
          <button type="button" id="openLog">Открыть лог</button>
          <span id="footerInfo">Ожидание сканирования архива</span>
          <div class="nav">
            <button type="button" id="startButton">Установить</button>
            <button type="button" id="cancelButton">Остановить</button>
          </div>
        </footer>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
