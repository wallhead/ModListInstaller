<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modlist Installer Beta</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="installer-shell">
      <section class="content">
        <header class="header">
          <div>
            <p class="eyebrow" id="stepLabel" hidden>Путь установки</p>
            <h1>Modlist Installer Beta</h1>
            <p class="version" id="versionText">Modlist Installer v0.2.6 by WallHead</p>
          </div>
        </header>

        <section class="panel">
          <div class="form-grid">
            <p class="unpack-note">
              Распаковка должна происходить по короткому пути, после распаковки установщик перенесет все файлы в папку установки
            </p>

            <label for="unpackDrive">Диск для распаковки</label>
            <div class="field-row compact">
              <select id="unpackDrive"></select>
              <span class="target" id="unpackTarget">Выберите диск</span>
            </div>

            <label for="installFolder">Папка установки</label>
            <div class="field-row">
              <input id="installFolder" type="text" autocomplete="off" spellcheck="false" />
              <button type="button" id="browseInstall">Обзор</button>
            </div>

            <span class="final-label">Итоговый путь</span>
            <span class="target final-target" id="finalInstallFolder">Выберите папку установки</span>
          </div>

          <div class="progress-wrap">
            <div class="progress-line">
              <span id="statusText">Ожидание | Ожидание проверки</span>
              <strong id="percentText">0%</strong>
            </div>
            <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <span id="progressFill"></span>
            </div>
          </div>

          <textarea id="logOutput" readonly spellcheck="false"></textarea>
        </section>

        <footer class="footer">
          <button type="button" id="openLog">Открыть лог</button>
          <div class="nav">
            <button type="button" id="startButton">Установить</button>
            <button type="button" id="cancelButton">Остановить</button>
          </div>
        </footer>
      </section>
    </main>

    <div class="modal-backdrop" id="messageModal" hidden>
      <section class="message-modal" role="dialog" aria-modal="true" aria-labelledby="messageTitle">
        <h2 id="messageTitle"></h2>
        <p id="messageText" hidden></p>
        <div class="modal-actions">
          <button type="button" id="messageCancel" hidden>Отмена</button>
          <button type="button" id="messageOk">OK</button>
        </div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
